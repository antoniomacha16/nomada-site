    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --cream: #F5EDE0;
            --cream-light: #FAF6EE;
            --brown-deep: #3D2817;
            --brown-medium: #715942;
            --gold: #95611A;
            --gold-hover: #805317;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: var(--cream);
            color: var(--brown-deep);
            font-family: 'Inter', sans-serif; font-weight: 300;
            min-height: 100vh;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            text-align: center; padding: 24px;
        }
        .logo {
            font-family: 'Playfair Display', serif;
            font-size: 22px; letter-spacing: 0.3em;
            color: #7a4900; font-weight: 500; text-decoration: none;
            margin-bottom: 48px;
        }
        .code {
            font-family: 'Playfair Display', serif;
            font-size: clamp(80px, 18vw, 160px); line-height: 1;
            color: var(--gold); opacity: 0.35; margin-bottom: 8px;
        }
        h1 {
            font-family: 'Playfair Display', serif; font-weight: 400;
            font-size: clamp(24px, 4vw, 36px); margin-bottom: 12px;
        }
        p { color: var(--brown-medium); font-size: 15px; max-width: 420px; margin-bottom: 36px; line-height: 1.7; }
        .cta-btn {
            display: inline-flex; align-items: center; gap: 10px;
            background: var(--gold); color: var(--cream);
            padding: 16px 28px; text-decoration: none;
            font-size: 12px; letter-spacing: 0.16em; text-transform: uppercase;
            font-weight: 500; border-radius: 25px;
            box-shadow: 0 6px 18px rgba(149, 97, 26, 0.28);
            transition: background 0.25s ease, transform 0.25s ease, box-shadow 0.25s ease;
        }
        .cta-btn:hover {
            background: var(--gold-hover);
            transform: translateY(-3px);
            box-shadow: 0 12px 26px rgba(149, 97, 26, 0.38);
        }
    </style>
</head>
